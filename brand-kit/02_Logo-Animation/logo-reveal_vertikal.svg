<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 190.83" role="img" aria-labelledby="t">
<title id="t">Dreiland Finanzen – animierter Logo-Reveal (vertikal, farbig)</title>
<desc>Vektor-Rekonstruktion aus der Rastervorlage. Schrift in Pfade umgewandelt (Annäherung: Montserrat Bold / Regular). Farben aus dem Raster gemessen – Annäherung.</desc>
<style>
  .p-blue, .p-gold, .p-red, .divider, .w-dreiland, .w-finanzen {
    transform-box: fill-box; transform-origin: center;
    animation-duration: .9s; animation-timing-function: cubic-bezier(.16,1,.3,1); animation-fill-mode: both;
  }
  .p-blue  { animation-name: df-blue;  animation-delay: .05s; }
  .p-gold  { animation-name: df-gold;  animation-delay: .17s; }
  .p-red   { animation-name: df-red;   animation-delay: .29s; }
  .divider { animation-name: df-line;  animation-delay: .55s; animation-duration: .6s; }
  .w-dreiland { animation-name: df-word; animation-delay: .70s; }
  .w-finanzen { animation-name: df-sub;  animation-delay: .90s; animation-duration: 1.1s; }
  @keyframes df-blue { from { opacity: 0; transform: translate(-10.4px, -6.0px); } }
  @keyframes df-gold { from { opacity: 0; transform: translate(10.4px, -6.0px); } }
  @keyframes df-red  { from { opacity: 0; transform: translate(0, 12px); } }
  @keyframes df-line { from { opacity: 0; transform: scaleY(0); } }
  @keyframes df-word { from { opacity: 0; transform: translateX(-10px); } }
  @keyframes df-sub  { from { opacity: 0; transform: translateX(-6px); } }
  @media (prefers-reduced-motion: reduce) {
    .p-blue, .p-gold, .p-red, .divider, .w-dreiland, .w-finanzen { animation: none !important; }
  }
</style>
<g id="bildmarke" transform="translate(8 8) scale(1.2) translate(21.9 -26.2)">
  <polygon id="flaeche-blau" class="p-blue" fill="#0A4682" points="20.6,26.8 20.6,51.6 40.4,63.03 61.88,50.63"/>
  <polygon id="flaeche-gold" class="p-gold" fill="#C69D49" points="95.6,26.2 60.9,46.23 66.3,49.35 66.3,69.52 95.6,52.6"/>
  <polygon id="flaeche-rot" class="p-red" fill="#CE2530" points="43.3,64.9 62.8,53.64 62.8,75.39 71.0,70.65 71.0,104.39 43.3,88.4"/>
</g>
