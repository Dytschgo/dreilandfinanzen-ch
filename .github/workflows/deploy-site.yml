# Baut die veröffentlichbare Website aus styles/ und legt sie in den Branch `site`.
# Hostinger (Git-Deployment) zieht den Branch `site` ins Web-Root von dreilandfinanzen.ch.
name: Website bauen

on:
  push:
    branches: [main]
    paths:
      - "styles/**"
      - "tools/build_site.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: site/ bauen
        run: python tools/build_site.py

      - name: Branch `site` aktualisieren
        working-directory: site
        run: |
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website aus ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site:site
