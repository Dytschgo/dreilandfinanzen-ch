<style>
@font-face { font-family: Geist; src: url(_assets/fonts/Geist-VF.ttf) format("truetype"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url(_assets/fonts/GeistMono-VF.ttf) format("truetype"); font-weight: 100 900; font-display: swap; }

/* shadcn/ui · new-york · neutral */
:root {
  --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0); --popover: oklch(1 0 0);
  --primary: oklch(0.205 0 0); --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.97 0 0); --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0); --accent-foreground: oklch(0.205 0 0);
  --border: oklch(0.922 0 0); --input: oklch(0.922 0 0); --ring: oklch(0.708 0 0);
  --radius: 0.625rem;
  color-scheme: light;
}
.dark {
  --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0); --popover: oklch(0.205 0 0);
  --primary: oklch(0.922 0 0); --primary-foreground: oklch(0.205 0 0);
  --secondary: oklch(0.269 0 0); --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0); --accent-foreground: oklch(0.985 0 0);
  --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 15%); --ring: oklch(0.556 0 0);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; border-color: var(--border); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100svh; background: var(--background); color: var(--foreground);
       font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.5;
       -webkit-font-smoothing: antialiased; font-feature-settings: "rlig" 1, "calt" 1; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); border-color: var(--ring); }

/* ---------- Button ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 2.25rem; padding: 0 1rem;
       border-radius: calc(var(--radius) - 2px); border: 1px solid transparent; background: transparent; font-size: .875rem; font-weight: 500;
       white-space: nowrap; cursor: pointer; transition: color .15s, background-color .15s, border-color .15s, box-shadow .15s; }
.btn-outline { border-color: var(--border); background: var(--background); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
.dark .btn-outline { background: color-mix(in oklch, var(--input) 30%, transparent); border-color: var(--input); }
.btn-outline:hover, .btn-ghost:hover { background: var(--accent); color: var(--accent-foreground); }
.btn-sm { height: 2rem; padding: 0 .75rem; gap: .375rem; font-size: .8125rem; }
.btn-icon { width: 2.25rem; padding: 0; }
.btn-icon.btn-sm { width: 2rem; }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 40; height: 3.5rem; border-bottom: 1px solid var(--border);
               background: color-mix(in oklch, var(--background) 95%, transparent); backdrop-filter: blur(8px); }
.container { height: 100%; max-width: 1536px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; gap: 1rem; }
.logo { display: flex; align-items: center; gap: .5rem; font-weight: 600; letter-spacing: -.01em; }
.logo img { height: 22px; width: auto; }
.nav { display: flex; gap: 1.5rem; margin-left: 1.5rem; font-size: .875rem; }
.nav a { color: var(--muted-foreground); transition: color .15s; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--foreground); }
.spacer { flex: 1; }
.search { display: inline-flex; align-items: center; gap: .5rem; width: 16rem; height: 2rem; padding: 0 .375rem 0 .75rem;
          border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); background: color-mix(in oklch, var(--muted) 50%, transparent);
          color: var(--muted-foreground); font-size: .8125rem; cursor: pointer; transition: background-color .15s; }
.search:hover { background: var(--accent); }
.search span { flex: 1; text-align: left; }
kbd { display: inline-flex; align-items: center; gap: 2px; height: 1.25rem; padding: 0 .375rem; border-radius: .25rem; border: 1px solid var(--border);
      background: var(--muted); color: var(--muted-foreground); font: 500 .6875rem "Geist Mono", ui-monospace, monospace; }
.vsep { width: 1px; height: 1rem; background: var(--border); }

/* ---------- Layout ---------- */
.layout { max-width: 1536px; margin: 0 auto; display: grid; grid-template-columns: 15rem minmax(0, 1fr); }
.sidebar { position: sticky; top: 3.5rem; height: calc(100svh - 3.5rem); overflow-y: auto; padding: 1.5rem .75rem 2rem 1.5rem; border-right: 1px solid var(--border); }
.sb-group { margin-bottom: 1.25rem; }
.sb-group h4 { margin: 0 0 .25rem; padding: 0 .5rem; font-size: .75rem; font-weight: 500; color: var(--muted-foreground); }
.sb-item { display: flex; align-items: center; gap: .5rem; width: 100%; height: 2rem; padding: 0 .5rem; border: 0; border-radius: calc(var(--radius) - 4px);
           background: transparent; color: var(--muted-foreground); font-size: .875rem; text-align: left; cursor: pointer; transition: color .15s, background-color .15s; }
.sb-item:hover { color: var(--foreground); background: var(--accent); }
.sb-item[aria-current="true"] { color: var(--foreground); background: var(--accent); font-weight: 500; }
.sb-item .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item .tag { font-size: .6875rem; color: var(--muted-foreground); font-weight: 400; }

.main { min-width: 0; padding: 1.5rem 1.5rem 3rem; }
.crumbs { display: flex; align-items: center; gap: .375rem; font-size: .875rem; color: var(--muted-foreground); }
.crumbs .i { width: 14px; height: 14px; }
.crumbs b { color: var(--foreground); font-weight: 400; }
h1 { margin: .5rem 0 .25rem; font-size: 1.875rem; line-height: 1.2; font-weight: 600; letter-spacing: -.025em; }
.lead { margin: 0; font-size: 1rem; color: var(--muted-foreground); }
.badges { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .875rem; }
.badge { display: inline-flex; align-items: center; gap: .375rem; height: 1.375rem; padding: 0 .5rem; border-radius: calc(var(--radius) - 4px);
         border: 1px solid var(--border); font-size: .75rem; font-weight: 500; }
.badge.secondary { background: var(--secondary); border-color: transparent; }
.dot { width: 6px; height: 6px; border-radius: 99px; }

/* ---------- Block toolbar ---------- */
.toolbar { display: flex; align-items: center; gap: .5rem; margin: 1.5rem 0 .75rem; flex-wrap: wrap; }
.tabs { display: inline-flex; align-items: center; height: 2.25rem; padding: 3px; border-radius: var(--radius); background: var(--muted); color: var(--muted-foreground); }
.tab { display: inline-flex; align-items: center; justify-content: center; gap: .375rem; height: 100%; padding: 0 .75rem; border: 1px solid transparent; border-radius: calc(var(--radius) - 2px);
       background: transparent; font-size: .875rem; font-weight: 500; color: inherit; cursor: pointer; transition: color .15s, background-color .15s, box-shadow .15s; }
.tab[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
.dark .tab[aria-selected="true"] { background: color-mix(in oklch, var(--input) 30%, transparent); border-color: var(--input); }
.toggle-group { display: inline-flex; height: 2rem; border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); overflow: hidden; box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
.toggle { display: inline-flex; align-items: center; justify-content: center; width: 2.25rem; border: 0; border-right: 1px solid var(--border); background: transparent; color: var(--muted-foreground); cursor: pointer; transition: background-color .15s, color .15s; }
.toggle:last-child { border-right: 0; }
.toggle:hover { background: var(--accent); color: var(--foreground); }
.toggle[aria-pressed="true"] { background: var(--accent); color: var(--foreground); }
.size { font: 500 .75rem "Geist Mono", ui-monospace, monospace; color: var(--muted-foreground); min-width: 4.5rem; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Preview (resizable) ---------- */
.preview { position: relative; height: max(560px, calc(100svh - 17.5rem)); border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px);
           background-color: var(--muted); background-image: radial-gradient(color-mix(in oklch, var(--foreground) 12%, transparent) 1px, transparent 1px); background-size: 16px 16px; overflow: hidden; }
.panel { position: relative; height: 100%; width: 100%; max-width: 100%; min-width: 320px; background: var(--background); border-right: 1px solid var(--border); }
.panel.full { border-right: 0; }
.panel iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
.handle { position: absolute; top: 0; bottom: 0; right: -7px; width: 14px; display: grid; place-items: center; cursor: ew-resize; z-index: 3; touch-action: none; }
.handle::before { content: ""; width: 6px; height: 2.5rem; border-radius: 99px; background: var(--border); box-shadow: 0 0 0 1px var(--background); transition: background-color .15s; }
.handle:hover::before, .handle.drag::before { background: var(--ring); }
.panel.full .handle { right: 0; }
.dragging iframe { pointer-events: none; }
.spot { position: absolute; display: none; pointer-events: none; z-index: 2; border-radius: calc(var(--radius) + 2px);
        box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--foreground), 0 0 0 100vmax rgb(0 0 0 / .5); transition: top .25s, left .25s, width .25s, height .25s; }
.preview[data-focus="calc"] .spot { display: block; }
.skeleton { position: absolute; inset: 0; display: grid; place-items: center; background: var(--background); color: var(--muted-foreground); font-size: .8125rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 1; }
.panel.loading .skeleton { opacity: 1; }

/* ---------- Pager ---------- */
.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; }
.pager .btn { height: auto; padding: .625rem 1rem; flex-direction: column; align-items: flex-start; gap: 0; max-width: 48%; }
.pager .btn small { font-size: .75rem; font-weight: 400; color: var(--muted-foreground); display: flex; align-items: center; gap: .25rem; }
.pager .btn.next { align-items: flex-end; margin-left: auto; }

/* ---------- Command dialog ---------- */
dialog { padding: 0; border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); background: var(--popover); color: var(--foreground);
         width: min(32rem, calc(100vw - 2rem)); box-shadow: 0 25px 50px -12px rgb(0 0 0 / .25); overflow: hidden; }
dialog::backdrop { background: rgb(0 0 0 / .5); }
dialog[open] { animation: zoom .15s ease-out; }
@keyframes zoom { from { opacity: 0; transform: scale(.96); } }
.cmd-input { display: flex; align-items: center; gap: .5rem; height: 3rem; padding: 0 .75rem; border-bottom: 1px solid var(--border); color: var(--muted-foreground); }
.cmd-input input { flex: 1; height: 100%; border: 0; background: transparent; color: var(--foreground); font: inherit; font-size: .875rem; outline: none; box-shadow: none; }
.cmd-list { max-height: 22rem; overflow-y: auto; padding: .25rem; scroll-padding: .25rem; }
.cmd-group { padding: .25rem 0; }
.cmd-group h5 { margin: 0; padding: .375rem .5rem; font-size: .75rem; font-weight: 500; color: var(--muted-foreground); }
.cmd-item { display: flex; align-items: center; gap: .5rem; width: 100%; padding: .375rem .5rem; border: 0; border-radius: calc(var(--radius) - 4px); background: transparent; font-size: .875rem; text-align: left; cursor: default; }
.cmd-item[data-selected="true"] { background: var(--accent); color: var(--accent-foreground); }
.cmd-item .i { color: var(--muted-foreground); }
.cmd-item .sub { margin-left: auto; font-size: .75rem; color: var(--muted-foreground); }
.cmd-empty { padding: 1.5rem; text-align: center; font-size: .875rem; color: var(--muted-foreground); }
.cmd-foot { display: flex; gap: 1rem; padding: .5rem .75rem; border-top: 1px solid var(--border); font-size: .75rem; color: var(--muted-foreground); }

/* ---------- Mobile sheet ---------- */
.menu-btn { display: none; }
.sheet { position: fixed; inset: 0; z-index: 50; display: none; }
.sheet.open { display: block; }
.sheet .scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .5); }
.sheet .sidebar { position: absolute; top: 0; left: 0; bottom: 0; width: min(18rem, 85vw); height: 100%; background: var(--background); border-right: 1px solid var(--border); animation: slide .2s ease-out; }
@keyframes slide { from { transform: translateX(-100%); } }

@media (max-width: 1024px) { .nav, .search span, .search kbd { display: none; } .search { width: 2rem; padding: 0; justify-content: center; } }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .layout > .sidebar { display: none; }
  .menu-btn { display: inline-flex; }
  .container, .main { padding-left: 1rem; padding-right: 1rem; }
  .toggle-group [data-w="768"], .size, .handle { display: none; }
  h1 { font-size: 1.5rem; }
  .preview { height: calc(100svh - 15rem); min-height: 520px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
</head>

<script>
const STYLES = [
  ["claude-01-geschmack-a", "Augenmass", "claude", "Eigener Geschmack", "Schweizer Raster, Bildmarke als Konstruktionszeichnung."],
  ["claude-02-geschmack-b", "Das Heft", "claude", "Eigener Geschmack", "Editorial wie ein Schweizer Magazin über Geld und Vertrauen."],
  ["claude-03-frei", "Die rote Linie", "claude", "Voll kreativ", "Eine rote Grenzlinie zeichnet sich durch die Seite."],
  ["claude-04-ultramodern", "Isometrie", "claude", "Ultra-modern", "SVG-Konstruktionslinien, andockende Flächen, animierter Rechner."],
  ["claude-05-webgpu", "Tragwerk", "claude", "WebGPU", "Partikel-Szene mit Compute-Shader und Tragbarkeitsring."],
  ["claude-06-klartext", "Klartext", "claude", "Freie Wahl", "Die Überschrift ist die ehrliche Antwort des Rechners."],
  ["sol-01-geschmack-a", "Spielraum", "sol", "Eigener Geschmack", "Hell, ruhig und editorial mit isometrischer Bildmarke."],
  ["sol-02-geschmack-b", "Rhein & Haltung", "sol", "Eigener Geschmack", "Dunkles Editorial mit schematischer Dreiland-Karte."],
  ["sol-03-frei", "Spielraum (Architektur)", "sol", "Voll kreativ", "Räumliche Architektur: was nach der Rate übrig bleibt."],
  ["sol-04-ultramodern", "Im Einklang", "sol", "Ultra-modern", "Logo-Reveal, SVG-Flächenaufbau und Morphing."],
  ["sol-05-webgpu", "Spielraum (WebGPU)", "sol", "WebGPU", "Plastische Farbflächen mit WGSL-Shadern und Compute-Partikeln."],
  ["astra-01-ultrakreativ", "Eine Landschaft für Ihr Leben", "astra", "Ultra-kreativ", "Terrassierte Inseln, goldene Brücken, Perspektivwechsel."],
  ["astra-02-ultrakreativ", "Der Dreiland-Atlas", "astra", "Ultra-kreativ", "Relief-Landschaft aus drei Ländern, verbunden durch den Rhein."],
  ["astra-03-ultrakreativ", "Am selben Tisch", "astra", "Ultra-kreativ", "Die Seite als Beratungsgespräch – auch ein Nein ist ein Abschluss."],
];
const MODELS = { claude: ["Claude Opus 5.5", "#D97757"], sol: ["GPT-6.1 Sol", "#10A37F"], astra: ["GPT-6 Astra", "#7C5CFF"] };
const $ = id => document.getElementById(id);
const frame = $("frame"), panel = $("panel"), preview = $("preview");
let current = -1, focusMode = "page";

/* ---------- Sidebar ---------- */
function buildSidebar(root) {
  root.innerHTML = Object.entries(MODELS).map(([m, [label]]) => `
    <div class="sb-group"><h4>${label}</h4>${STYLES.map((s, i) => s[2] !== m ? "" :
      `<button class="sb-item" data-i="${i}"><span class="n">${s[1]}</span><span class="tag">${s[3] === "Eigener Geschmack" ? "" : s[3]}</span></button>`).join("")}</div>`).join("");
  root.querySelectorAll(".sb-item").forEach(b => b.addEventListener("click", () => { show(+b.dataset.i); closeSheet(); }));
}
buildSidebar($("sidebar")); buildSidebar($("sheetSidebar"));

/* ---------- Anzeige ---------- */
function show(i) {
  i = (i + STYLES.length) % STYLES.length;
  if (i === current) return;
  current = i;
  const [dir, name, model, kind, desc] = STYLES[i], [mLabel, mColor] = MODELS[model];
  panel.classList.add("loading");
  frame.src = `${dir}/index.html`;
  frame.title = `Design-Vorschau: ${name}`;
  $("crumbModel").textContent = mLabel; $("crumbName").textContent = name;
  $("title").textContent = name; $("lead").textContent = desc;
  $("badges").innerHTML = `<span class="badge"><span class="dot" style="background:${mColor}"></span>${mLabel}</span><span class="badge secondary">${kind}</span><span class="badge secondary">${i + 1} / ${STYLES.length}</span>`;
  $("openBtn").href = `${dir}/index.html`;
  $("prevName").textContent = STYLES[(i - 1 + STYLES.length) % STYLES.length][1];
  $("nextName").textContent = STYLES[(i + 1) % STYLES.length][1];
  document.querySelectorAll(".sb-item").forEach(b => b.setAttribute("aria-current", +b.dataset.i === i));
  document.title = `${name} – Dreiland Finanzen Design-Review`;
  syncUrl();
}
function syncUrl() {
  const q = new URLSearchParams(location.search);
  focusMode === "calc" ? q.set("ansicht", "rechner") : q.delete("ansicht");
  history.replaceState(null, "", `${q.toString() ? "?" + q : location.pathname}#${STYLES[current][0]}`);
}
$("prevBtn").onclick = () => show(current - 1);
$("nextBtn").onclick = () => show(current + 1);
frame.addEventListener("load", () => { panel.classList.remove("loading"); setTimeout(applyFocus, 300); });

/* ---------- Breite (resizable) ---------- */
function setWidth(px) {
  const max = preview.clientWidth;
  const w = px === "full" ? max : Math.max(320, Math.min(max, px));
  panel.style.width = px === "full" ? "100%" : w + "px";
  panel.classList.toggle("full", px === "full" || w >= max - 1);
  $("size").textContent = `${Math.round(px === "full" ? max : w)} px`;
  document.querySelectorAll(".toggle").forEach(t => t.setAttribute("aria-pressed", t.dataset.w === String(px)));
  schedule();
}
document.querySelectorAll(".toggle").forEach(t => t.addEventListener("click", () => { setWidth(t.dataset.w === "full" ? "full" : +t.dataset.w); setTimeout(applyFocus, 200); }));
const handle = $("handle");
handle.addEventListener("pointerdown", e => {
  e.preventDefault(); handle.setPointerCapture(e.pointerId); handle.classList.add("drag"); document.body.classList.add("dragging");
  const left = preview.getBoundingClientRect().left;
  const move = ev => setWidth(ev.clientX - left);
  const up = () => { handle.classList.remove("drag"); document.body.classList.remove("dragging"); handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up); applyFocus(); };
  handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up);
});
handle.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); e.stopPropagation(); setWidth(panel.getBoundingClientRect().width + (e.key === "ArrowLeft" ? -40 : 40)); }
});
window.addEventListener("resize", () => { if (panel.classList.contains("full")) setWidth("full"); else setWidth(panel.getBoundingClientRect().width); });

/* ---------- Kreditrechner-Fokus ---------- */
function setFocus(mode) {
  focusMode = mode; preview.dataset.focus = mode;
  $("tabPage").setAttribute("aria-selected", mode === "page");
  $("tabCalc").setAttribute("aria-selected", mode === "calc");
  if (current >= 0) syncUrl();
  if (mode === "calc") applyFocus(); else { try { frame.contentWindow.scrollTo({ top: 0, behavior: "instant" }); } catch {} }
}
$("tabPage").onclick = () => setFocus("page");
$("tabCalc").onclick = () => setFocus("calc");
let tracked = null, raf = 0;
function findCalc(doc) {
  const input = doc.querySelector("input[type=range]") || doc.querySelector("#amount, #betrag");
  if (!input) return null;
  const vw = doc.documentElement.clientWidth;
  const ok = el => /rate/i.test(el.innerText || "") && /CHF/.test(el.innerText || "") && el.querySelector("button, a");
  for (let el = input.parentElement; el && el !== doc.body; el = el.parentElement) {
    const r = el.getBoundingClientRect();
    if (r.width >= Math.min(vw * .3, 320) && r.height > 160 && ok(el)) return el;
  }
  return input.closest("section") || input.parentElement;
}
function placeSpot() {
  raf = 0;
  if (focusMode !== "calc" || !tracked) return;
  const r = tracked.getBoundingClientRect(), f = frame.getBoundingClientRect(), p = preview.getBoundingClientRect();
  const top = Math.max(r.top, 0), bottom = Math.min(r.bottom, f.height);
  Object.assign($("spot").style, { top: f.top - p.top + top + "px", left: f.left - p.left + Math.max(r.left, 0) + "px",
    width: Math.min(r.width, f.width) + "px", height: Math.max(bottom - top, 0) + "px" });
}
const schedule = () => { if (!raf) raf = requestAnimationFrame(placeSpot); };
function applyFocus() {
  if (focusMode !== "calc") return;
  let doc, win; try { doc = frame.contentDocument; win = frame.contentWindow; } catch { return; }
  if (!doc || !doc.body) return;
  tracked = findCalc(doc); if (!tracked) return;
  const headerH = () => { let h = 0; for (const el of doc.querySelectorAll("header, nav, [class*=header]")) { const cs = win.getComputedStyle(el), r = el.getBoundingClientRect();
    if ((cs.position === "fixed" || cs.position === "sticky") && r.top <= 2 && r.height < 200 && r.width > win.innerWidth * .5) h = Math.max(h, r.bottom); } return h; };
  const go = () => win.scrollTo({ top: Math.max(0, tracked.getBoundingClientRect().top + win.scrollY - headerH() - 16), behavior: "instant" });
  go(); setTimeout(() => { go(); schedule(); }, 450);
  win.addEventListener("scroll", schedule, { passive: true }); win.addEventListener("resize", schedule);
  schedule();
}

/* ---------- Theme ---------- */
function applyTheme(dark) {
  document.documentElement.classList.toggle("dark", dark);
  $("logoImg").src = `_assets/logo/dreiland-finanzen_icon_${dark ? "darkmode" : "farbig"}.svg`;
}
$("themeBtn").onclick = () => { const d = !document.documentElement.classList.contains("dark"); applyTheme(d); try { localStorage.setItem("df-theme", d ? "dark" : "light"); } catch {} };
applyTheme(document.documentElement.classList.contains("dark"));

/* ---------- Mobile Sheet ---------- */
const sheet = $("sheet");
function closeSheet() { sheet.classList.remove("open"); }
$("menuBtn").onclick = () => sheet.classList.add("open");
sheet.querySelector("[data-close]").onclick = closeSheet;

/* ---------- Command (Ctrl/⌘ K) ---------- */
const cmd = $("cmd"), input = $("cmdInput"), list = $("cmdList");
let sel = 0, items = [];
if (/Mac|iPhone|iPad/.test(navigator.platform)) $("modKey").textContent = "⌘";
function renderCmd() {
  const q = input.value.trim().toLowerCase();
  items = []; list.innerHTML = "";
  for (const [m, [label]] of Object.entries(MODELS)) {
    const hits = STYLES.map((s, i) => [s, i]).filter(([s]) => s[2] === m && (!q || `${s[1]} ${s[3]} ${s[4]} ${label}`.toLowerCase().includes(q)));
    if (!hits.length) continue;
    const g = document.createElement("div"); g.className = "cmd-group"; g.innerHTML = `<h5>${label}</h5>`;
    for (const [[, name, , kind], i] of hits) {
      const b = document.createElement("div");
      b.className = "cmd-item"; b.setAttribute("role", "option");
      b.innerHTML = `<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>${name}<span class="sub">${kind}</span>`;
      b.addEventListener("click", () => { show(i); cmd.close(); });
      b.addEventListener("pointermove", () => select(items.indexOf(b)));
      g.append(b); items.push(b);
    }
    list.append(g);
  }
  if (!items.length) list.innerHTML = `<div class="cmd-empty">Kein Design gefunden.</div>`;
  select(0);
}
function select(i) {
  if (!items.length) return;
  sel = (i + items.length) % items.length;
  items.forEach((b, j) => { b.dataset.selected = j === sel; b.setAttribute("aria-selected", j === sel); });
  items[sel].scrollIntoView({ block: "nearest" });
}
function openCmd() { input.value = ""; renderCmd(); cmd.showModal(); input.focus(); }
$("searchBtn").onclick = openCmd;
input.addEventListener("input", renderCmd);
input.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); select(sel + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); select(sel - 1); }
  else if (e.key === "Enter") { e.preventDefault(); items[sel]?.click(); }
});
cmd.addEventListener("click", e => { if (e.target === cmd) cmd.close(); });

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); cmd.open ? cmd.close() : openCmd(); return; }
  if (e.key === "Escape") closeSheet();
  if (cmd.open || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.activeElement === handle) return;
  if (e.key === "ArrowRight") show(current + 1);
  if (e.key === "ArrowLeft") show(current - 1);
});
window.addEventListener("hashchange", () => { const i = STYLES.findIndex(s => s[0] === location.hash.slice(1)); if (i >= 0) show(i); });

/* ---------- Start ---------- */
const params = new URLSearchParams(location.search);
const start = STYLES.findIndex(s => s[0] === location.hash.slice(1));
show(start >= 0 ? start : 0);
if (["rechner", "kreditrechner"].includes(params.get("ansicht"))) setFocus("calc");
setWidth("full");
</script>
</body>
</html>
